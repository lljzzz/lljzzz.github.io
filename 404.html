.btn-sm{padding:8px 16px;font-size:.9rem;margin-left:auto}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{background:var(--accent-hover);color:var(--accent-ink)}
.btn-ghost{color:var(--text);border-color:#6b7077}

main{flex:1;display:flex;align-items:center;padding-block:clamp(64px,8vw,96px);overflow-x:clip}

p.text{margin:16px 0 0;color:#c9cbcf;font-size:1.075rem}
.art{width:100%;max-height:min(64vh,560px);overflow:visible}
.ghost{fill:none;stroke:var(--line-strong);stroke-width:.05;stroke-linejoin:round;stroke-dasharray:.25 .2}
.fill{fill:var(--accent);opacity:.1}
.line{fill:none;stroke:var(--accent);stroke-width:.06;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:0}
.half-top{transform:translate(-.55px,-.4px) rotate(-3deg);transform-origin:12px 11px}
.half-bottom{transform:translate(.55px,.4px) rotate(2deg);transform-origin:12px 13px}
@media (prefers-reduced-motion:no-preference){
.line{animation:draw 1.3s cubic-bezier(.6,0,.2,1) .15s both}
.half{animation:split .7s cubic-bezier(.3,1.4,.4,1) 1.35s both}
@keyframes draw{from{stroke-dashoffset:1}}
@keyframes split{from{transform:none}}
}
@media (max-width:760px){.grid{grid-template-columns:minmax(0,1fr)}.art{order:-1;max-height:240px;justify-self:start;width:auto;height:240px}}
.actions{margin-top:32px;display:flex;flex-wrap:wrap;gap:16px}
footer{background:var(--bg-deep);border-top:1px solid var(--line);padding-block:32px;font-size:.86rem;color:var(--muted)}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 24px}
</style>
